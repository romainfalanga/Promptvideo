# Configuration de deploiement Netlify.
#
# Presente dans le depot pour que Netlify detecte tout seul comment construire
# le site au moment ou l'on relie le depot GitHub : aucune saisie manuelle de
# commande de build ni de dossier de publication.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# L'application est une page unique sans routage cote client. Ce repli evite
# simplement un 404 sur une URL tapee a la main ou un lien colle de travers.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Les fichiers d'assets portent un hash dans leur nom : ils sont immuables et
# peuvent etre caches indefiniment. Le HTML, lui, doit toujours etre revalide,
# sinon une mise a jour du site n'arrive jamais jusqu'au navigateur.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
